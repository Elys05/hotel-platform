<!DOCTYPE html>

<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Teranga - Connexion</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Playfair+Display:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#dbd9d9",
                        "on-secondary-fixed": "#271903",
                        "secondary-fixed": "#fbdeb9",
                        "surface-tint": "#4e5f7e",
                        "surface-container-high": "#eae8e7",
                        "tertiary-fixed": "#e5e2dd",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-primary-container": "#8293b5",
                        "outline-variant": "#c5c6ce",
                        "primary": "#031632",
                        "primary-container": "#1a2b48",
                        "on-tertiary-fixed-variant": "#474743",
                        "surface-bright": "#fbf9f8",
                        "on-error": "#ffffff",
                        "on-surface-variant": "#44474d",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#b6c7eb",
                        "inverse-surface": "#303030",
                        "surface-container": "#efeded",
                        "on-secondary-fixed-variant": "#564428",
                        "secondary": "#705b3e",
                        "secondary-container": "#fbdeb9",
                        "tertiary-container": "#2b2b28",
                        "background": "#fbf9f8",
                        "on-primary-fixed": "#081b38",
                        "tertiary": "#171714",
                        "secondary-fixed-dim": "#dec29f",
                        "tertiary-fixed-dim": "#c9c6c2",
                        "on-tertiary-container": "#93928e",
                        "on-surface": "#1b1c1c",
                        "on-background": "#1b1c1c",
                        "primary-fixed": "#d7e2ff",
                        "on-primary-fixed-variant": "#374765",
                        "on-tertiary": "#ffffff",
                        "surface": "#fbf9f8",
                        "surface-container-highest": "#e4e2e2",
                        "outline": "#75777e",
                        "on-secondary": "#ffffff",
                        "surface-container-low": "#f5f3f3",
                        "inverse-primary": "#b6c7eb",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e4e2e2",
                        "on-tertiary-fixed": "#1c1c19",
                        "on-secondary-container": "#766143",
                        "inverse-on-surface": "#f2f0f0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "margin-desktop": "64px",
                        "container-max": "1280px",
                        "margin-mobile": "20px",
                        "gutter": "24px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-md": ["Playfair Display"],
                        "headline-lg": ["Playfair Display"],
                        "headline-lg-mobile": ["Playfair Display"],
                        "body-lg": ["Inter"],
                        "display-lg": ["Playfair Display"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "headline-lg": ["40px", { "lineHeight": "48px", "fontWeight": "700" }],
                        "headline-lg-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "display-lg": ["64px", { "lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "700" }]

                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased overflow-hidden">
<!-- TopAppBar -->
<header class="bg-background w-full top-0 sticky flex items-center justify-between px-margin-mobile h-16 w-full z-10">
<button aria-label="Retour" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-container-high transition-colors active:opacity-70 text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">Teranga</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col justify-center px-margin-mobile pb-[120px] max-w-[400px] mx-auto w-full relative z-0">
<div class="mb-10 text-center">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2">Bienvenue</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Connectez-vous pour continuer</p>
</div>
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-1">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" placeholder="votre@email.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1">
<label class="font-label-sm text-label-sm text-on-surface" for="password">Mot de passe</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<div class="flex justify-end mt-1">
<a class="font-label-sm text-label-sm text-primary hover:underline" href="#">Mot de passe oublié ?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary py-4 rounded-lg font-label-sm text-label-sm uppercase tracking-wider hover:bg-primary transition-colors active:scale-[0.98] mt-8 shadow-sm" type="submit">
                Se Connecter
            </button>
</form>
<div class="mt-12 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Nouveau parmi nous ? 
                <a class="text-primary font-semibold hover:underline" href="#">Créer un compte</a>
</p>
</div>
</main>
<!-- Subtle decorative background element -->
<div class="absolute bottom-0 right-0 w-64 h-64 bg-secondary-container/20 rounded-tl-full -z-10 blur-3xl pointer-events-none"></div>
</body></html>
