<style>
        .glass-panel {
            background: rgba(3, 22, 50, 0.6);
            backdrop-filter: blur(16px);

<body class="bg-primary min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Background Image -->
<div class="absolute inset-0 z-0">
<div class="bg-cover bg-center w-full h-full opacity-20" data-alt="A breathtaking aerial view of a luxury hotel resort in West Africa at dusk, showing illuminated pools, lush tropical gardens, and traditional yet modern architecture. The image is bathed in deep twilight blues and subtle warm gold from the hotel lights, creating a sophisticated, dark-themed background with very low opacity to serve as a subtle texture for a login screen." style="background-image: url('https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-primary via-primary/80 to-primary/50"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-md px-margin-mobile md:px-0">
<!-- Logo Area -->
<div class="text-center mb-12">
<h1 class="font-headline-lg text-headline-lg text-on-primary tracking-tight">Teranga Hotels</h1>
<p class="font-body-md text-body-md text-on-primary/70 mt-2">Admin Portal</p>
</div>
<!-- Glassmorphism Login Card -->
<div class="glass-panel rounded-xl p-8 shadow-2xl">
<form action="#" class="space-y-6" method="POST">
<div>
<label class="block font-label-sm text-label-sm text-on-primary/90 mb-2" for="username">Username</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-primary/50 text-sm" data-icon="person">person</span>
</span>
<input class="block w-full pl-10 pr-3 py-3 bg-primary-container/50 border border-outline/30 rounded focus:ring-2 focus:ring-secondary focus:border-secondary font-body-md text-body-md text-on-primary placeholder-on-primary/40 transition-colors" id="username" name="username" placeholder="Enter your username" required="" type="text"/>
</div>
</div>
<div>
<label class="block font-label-sm text-label-sm text-on-primary/90 mb-2" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-primary/50 text-sm" data-icon="lock">lock</span>
</span>
<input class="block w-full pl-10 pr-3 py-3 bg-primary-container/50 border border-outline/30 rounded focus:ring-2 focus:ring-secondary focus:border-secondary font-body-md text-body-md text-on-primary placeholder-on-primary/40 transition-colors" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="h-4 w-4 bg-primary-container/50 border-outline/30 rounded text-secondary focus:ring-secondary" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-label-sm text-label-sm text-on-primary/70" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="font-label-sm text-label-sm">
<a class="text-secondary-fixed hover:text-secondary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
</div>
<div class="pt-4">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded bg-secondary text-on-secondary font-label-sm text-label-sm uppercase tracking-wider hover:bg-secondary-container hover:text-on-secondary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary focus:ring-offset-primary transition-all duration-300" type="submit">
                        Accéder au Dashboard
                    </button>
</div>
</form>
</div>
<!-- Footer snippet -->
<div class="mt-8 text-center">
<p class="font-label-sm text-label-sm text-on-primary/50">
                © 2024 Teranga Hospitality Group. Authorized access only.</p></div></main></body></html>
