<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        .grain-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");

            z-index: 1;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col relative overflow-hidden">
<!-- Subtle textured background simulation via gradient and grain overlay -->
<div class="absolute inset-0 bg-gradient-to-br from-surface to-surface-container-low -z-10"></div>
<div class="grain-overlay -z-10"></div>
<!-- Navigation suppressed as this is a transactional screen -->
<main class="flex-grow flex items-center justify-center p-margin-mobile w-full relative z-10">
<div class="w-full max-w-md bg-surface-container-lowest/80 backdrop-blur-md rounded-xl shadow-[0_24px_48px_rgba(3,22,50,0.05)] border border-surface-container border-opacity-50 p-8 sm:p-10 flex flex-col items-center">
<!-- Logo / Brand -->
<div class="mb-10 text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">Teranga</h1>
<p class="font-label-sm text-label-sm text-secondary tracking-widest uppercase mt-2">Hotels &amp; Resorts</p>
</div>
<!-- Form -->
<form action="#" class="w-full space-y-6" method="POST">
<div class="space-y-4">
<!-- Email Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="email">Adresse Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-secondary-fixed-dim/50 rounded-lg text-on-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="email" name="email" placeholder="vous@exemple.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="password">Mot de Passe</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-surface-container-lowest border border-secondary-fixed-dim/50 rounded-lg text-on-surface font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-lg">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Forgot Password -->
<div class="flex items-center justify-end">
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors underline-offset-4 hover:underline" href="#">
                        Mot de passe oublié ?
                    </a>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary py-4 px-6 rounded-lg font-label-sm text-label-sm uppercase tracking-wider hover:bg-primary-container active:scale-[0.98] transition-all shadow-md" type="submit">
                    Se Connecter
                </button>
</form>
<!-- Sign Up Link -->
<div class="mt-8 text-center border-t border-surface-container pt-6 w-full">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Nouveau parmi nous ? 
                    <a class="font-label-sm text-label-sm text-primary hover:text-secondary transition-colors underline-offset-4 hover:underline ml-1" href="#">
                        Créer un compte
                    </a>
</p>
</div>
</div>
</main>
</body></html>
